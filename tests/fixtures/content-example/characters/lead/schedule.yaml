timezone: Asia/Seoul
week_template:
  weekday: &weekday
    - { time: "09:00-12:00", activity: practice, busy: 3, initiative_ok: false, note: example }
  mon: *weekday
  tue: *weekday
  wed: *weekday
  thu: *weekday
  fri: *weekday
  sat: *weekday
  sun: *weekday
reply_delay_multiplier: { 0: 1.0, 3: 6.0 }
random_events:
  - id: r1
    name: example
    probability: 0.1
    duration_days: [1, 1]
    effect: { busy_delta: +1, tone: late reply }
exception_rules: [comeback week overridden by timeline beat]
