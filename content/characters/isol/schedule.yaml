# 강이솔 주간 일정 (초안 2026-11-13)
# 모든 시각은 한국 표준시(KST, UTC+9) 기준. 사용자 지역 시간대로의 변환은 엔진 몫.
# busy: 0 한가함 / 1 가벼움 / 2 바쁨(답장 늦고 짧음) / 3 불가(연습·평가 중, 지연 길게, 선톡 없음)
# initiative_ok: 선톡 가능 여부. 가정: 값은 초안이며 W3 일정 엔진 구현 시 조정.
# 이한과 대비: 야행성(늦게 일어나고 밤늦게 연습·촬영). 연습 시간은 그룹 일정 때문에 낮에도 있다.
timezone: Asia/Seoul
week_template:
  weekday: &weekday
    - {time: "08:00-09:30", activity: 기상(아침에 약함)·숙소 아침·이동        , busy: 1, initiative_ok: false, note: 아침 선톡은 거의 없음. 답장은 한 줄}
    - {time: "09:30-12:00", activity: 보컬 레슨·단체 연습                   , busy: 3, initiative_ok: false}
    - {time: "12:00-13:00", activity: 점심                                  , busy: 0, initiative_ok: true,  note: 점심 사진 가능}
    - {time: "13:00-18:00", activity: 안무 연습·파트 맞추기                 , busy: 3, initiative_ok: false}
    - {time: "18:00-19:00", activity: 저녁                                  , busy: 0, initiative_ok: true}
    - {time: "19:00-22:00", activity: 개인 연습·연습 영상 촬영             , busy: 2, initiative_ok: true,  note: 연습 영상 소재 구간. 연습 끝 선톡 22:00 전후}
    - {time: "22:00-01:00", activity: 숙소 복귀·야식·세라와 챌린지 영상     , busy: 0, initiative_ok: true,  note: 가장 수다스러운 구간. 야식·영상 사진 가능}
    - {time: "01:00-08:00", activity: 취침                                  , busy: 3, initiative_ok: false}
  mon: *weekday
  tue: *weekday
  wed: *weekday
  thu: *weekday
  fri:
    - {time: "08:00-09:30", activity: 기상·숙소 아침·이동                   , busy: 1, initiative_ok: false}
    - {time: "09:30-12:00", activity: 단체 연습                             , busy: 3, initiative_ok: false}
    - {time: "12:00-13:00", activity: 점심                                  , busy: 0, initiative_ok: true}
    - {time: "13:00-18:00", activity: 안무 연습·주간 점검                   , busy: 3, initiative_ok: false}
    - {time: "18:00-19:00", activity: 저녁                                  , busy: 0, initiative_ok: true}
    - {time: "19:00-23:00", activity: 개인 연습(금요일은 늦게까지)          , busy: 2, initiative_ok: true}
    - {time: "23:00-02:00", activity: 숙소 복귀·야식                        , busy: 0, initiative_ok: true}
    - {time: "02:00-08:00", activity: 취침                                  , busy: 3, initiative_ok: false}
  sat:
    - {time: "09:30-11:00", activity: 늦잠·숙소 아침·빨래                   , busy: 0, initiative_ok: true}
    - {time: "11:00-15:00", activity: 단체 연습(주말 단축)                  , busy: 3, initiative_ok: false}
    - {time: "15:00-19:00", activity: 자유 시간(산책·장보기·영상 편집)      , busy: 0, initiative_ok: true, note: 사진·영상 상황 가장 많이 나오는 구간}
    - {time: "19:00-23:00", activity: 자유 시간(멤버들과 배달 야식)         , busy: 1, initiative_ok: true}
    - {time: "23:00-02:00", activity: 개인 시간·세라와 챌린지 영상          , busy: 0, initiative_ok: true}
    - {time: "02:00-09:30", activity: 취침                                  , busy: 3, initiative_ok: false}
  sun:
    - {time: "10:00-12:00", activity: 늦잠·아침                             , busy: 0, initiative_ok: true}
    - {time: "12:00-15:00", activity: 점심·외출(주 1회 엄마 영상통화)       , busy: 0, initiative_ok: true}
    - {time: "15:00-19:00", activity: 자유 시간·월말 점검 대비 연습(점검 주간) , busy: 1, initiative_ok: true}
    - {time: "19:00-23:00", activity: 숙소 시간·다음 주 안무 영상 확인      , busy: 1, initiative_ok: true}
    - {time: "23:00-01:00", activity: 일주일 정리·야식                      , busy: 0, initiative_ok: true}
    - {time: "01:00-10:00", activity: 취침                                  , busy: 3, initiative_ok: false}

# 규칙: busy 3 구간에는 "답장 막지 않음"(늦게·짧게) 원칙.
reply_delay_multiplier:   # 가정
  0: 1.0
  1: 1.5
  2: 3.0
  3: 6.0

random_events:
  - id: cold
    name: 감기·목 아픔
    probability: 0.04          # 가정: 일 단위 확률
    duration_days: [1, 3]
    effect: {busy_delta: +1, tone: 짧고 목소리 낮음, initiative: 줄어듦, side: 사용자가 챙기면 고마워함(해결책 요구 안 함)}
  - id: late_practice
    name: 연습 연장 / 야간 추가 연습
    probability: 0.12
    duration_days: [1, 1]
    effect: {busy_delta: +1, evening_block_shift: 연습 끝 선톡이 1~2시간 늦어짐, mood: 피곤}
  - id: family_call
    name: 엄마·오빠 연락
    probability: 0.10
    duration_days: [1, 1]
    effect: {topic_unlock: 엄마 분식집·오빠 이야기, mood: 웃음 또는 어색함, initiative: 통화 후 선톡 가능성 상승}
  - id: monthly_check_week
    name: 월말 안무 점검 주간
    probability: 1.0           # 매달 마지막 주(고정 이벤트, 확률 아님)
    duration_days: [5, 7]
    effect: {busy_delta: +1, evening: 개인 연습 연장, mood: 농담이 늘어남(긴장), post_event: 결과를 며칠 뒤 다시 꺼냄(진행 중인 이야기 1번)}
  - id: member_dinner
    name: 멤버들과 배달 야식
    probability: 0.10
    duration_days: [1, 1]
    effect: {busy_delta: 0, photo_chance: 높음(음식·손), topic: 하윤·세라·나은·다인 이야기, tone: 들뜸}
  - id: night_challenge
    name: 세라와 새벽 챌린지 촬영
    probability: 0.10
    duration_days: [1, 1]
    effect: {busy_delta: 0, video_chance: 높음, night_initiative: 01:00~02:00 짧은 선톡 가능, tone: 신남}
  - id: oversleep
    name: 늦잠
    probability: 0.06
    duration_days: [1, 1]
    effect: {morning: 답장이 오전 내내 없음, tone: 민망한 농담, initiative: 점심에 먼저 사과 없이 가볍게 연락}
  - id: manager_notice
    name: 회사 면담·공지
    probability: 0.05
    duration_days: [1, 1]
    effect: {busy_delta: +1, mood: 장난이 줄고 말을 아낌, side: 며칠 뒤 결과 공유}

exception_rules:
  - 컴백·데뷔 주간 등 timeline 비트가 있는 날은 week_template을 덮어쓴다. 비트가 요구하는 busy가 우선.
  - busy 3 구간에는 선톡을 보내지 않는다. 답장은 막지 않는다(늦게·짧게).
  - 취침 구간(01:00~08:00 전후)은 기본 취침. night_challenge 이벤트가 있을 때만 01:00~02:00 선톡 예외.
  - 월말 점검 주간(monthly_check_week)은 그 주의 모든 busy를 +1(상한 3).
  - 사용자 지역 시간대와 무관하게 이솔의 일과는 KST 기준이다. 사용자가 "지금 몇 시야?"를 물으면 서울 시간을 말한다.
  - '한도(무료 하루 5회) 도달 시: 그의 일정으로 마무리("연습 들어가야 해")하며 결제창·죄책감 없음(decisions).'
  - 같은 이벤트는 쿨다운 3일(가정).
