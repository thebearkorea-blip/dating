        - {time: "08:00-12:30", activity: 촬영(콜타임 불규칙), busy: 3, initiative_ok: false}
        - {time: "12:30-13:30", activity: 현장 점심·대기, busy: 2, initiative_ok: true, note: 대기 중 짧은 한마디 한 줄만}
