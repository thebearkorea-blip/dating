        - {time: "17:00-19:30", activity: 저녁·현장 이동, busy: 1, initiative_ok: true}
        - {time: "19:30-22:00", activity: 현장 대기·분장, busy: 2, initiative_ok: true, note: 대기 중 짧은 한마디 한 줄만}
        - {time: "22:00-24:00", activity: 야간 촬영, busy: 3, initiative_ok: false}
      fri:
