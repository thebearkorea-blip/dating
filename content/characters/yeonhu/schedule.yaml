      sat:
        - {time: "00:00-05:00", activity: 야간 촬영(이어서), busy: 3, initiative_ok: false}
        - {time: "05:00-13:00", activity: 귀가·취침(야간 촬영 다음 날 오전), busy: 3, initiative_ok: false}
        - {time: "13:00-19:00", activity: 자유 시간(헌책방·장보기), busy: 0, initiative_ok: true}
        - {time: "19:00-24:00", activity: 저녁·편지 정리, busy: 1, initiative_ok: true}
