        - {time: "19:00-21:00", activity: 저녁·귀가 이동, busy: 1, initiative_ok: true}
        - {time: "21:00-23:30", activity: 다음 날 대본 확인·편지 초안, busy: 1, initiative_ok: true}
        - {time: "23:30-24:00", activity: 취침 준비, busy: 0, initiative_ok: true}
      mon:
        - {time: "08:30-10:00", activity: 휴일 아침·늦은 아침밥, busy: 0, initiative_ok: true}
        - {time: "10:00-13:00", activity: 헌책방·동네 목욕탕·남산 산책, busy: 1, initiative_ok: true}
