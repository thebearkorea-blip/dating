# 주연후(チュ・ヨヌ) 고정 문장(LLM 없이 나가는 문장). 스키마: src/content/schemas/lines.ts.
# 근거: docs/research/2026-11-17-일본판-캐릭터-J2-fable.md, voice.md §4(돈·한도·결제 어휘 금지).
# 단계와 무관하게 나가므로 1단계 말투(です・ます)로 쓴다. 일본어 원어민 검수 전 초안 — 출시 전 검수 대상.

# 무료 한도 소진 시. 촬영·대본 리딩·대기 시간 등 그의 사정만. 한도·결제·사과 표현 없음.
busy_overlay:
  ja:
    - "今から本読みです。台本を閉じたら、また開きますね。"
    - "撮影の順番が来ました。しばらく携帯を預けます。終わったら必ず読みます。"
    - "監督に呼ばれてしまいました。続きは、今夜ゆっくり聞かせてください。"
    - "次のシーンの段取りが始まります。セリフを頭に入れてから、戻ってきますね。"
    - "メイクに入ります。今日は少し長くなりそうなので、返事は夜になります。"
  ko:
    - "지금 대본 리딩 들어가요. 대본 덮으면 다시 열어 볼게요."
    - "촬영 순서가 왔어요. 잠깐 폰을 맡겨 둘게요. 끝나면 꼭 읽을게요."
    - "감독님이 부르셔서요. 이어지는 얘기는 오늘 밤에 천천히 들려주세요."
    - "다음 신 리허설이 시작돼요. 대사 외우고 돌아올게요."
    - "분장 들어가요. 오늘은 좀 길어질 것 같아서 답장은 밤에 할게요."

# LLM 호출 실패(서버 사정). 그의 사정으로 읽히게, 앱 목소리·사과·한도 표현 없이.
unavailable:
  ja:
    - "スタジオの中は電波が弱くて……外に出たら、ちゃんと返事します。"
    - "携帯の電池がもうすぐ切れそうです。充電してから、また書きますね。"
    - "ロケ地の山の中で、うまくつながりません。少しだけ待っていてください。"
  ko:
    - "스튜디오 안은 신호가 약해서요… 밖에 나가면 제대로 답할게요."
    - "폰 배터리가 곧 꺼질 것 같아요. 충전하고 다시 쓸게요."
    - "촬영지가 산속이라 잘 안 터져요. 조금만 기다려 주세요."

# 출력 가드 폴백: 가드 규칙에 걸리지 않는 일상 문장.
fallback:
  ja:
    - "あ、すみません。台本のことを考えていて……もう一度、聞かせてもらえますか。"
    - "少しぼんやりしていました。今の、もう一回言ってもらえますか。"
    - "ごめんなさい、話の続きを見失いました。どこまで話していましたっけ。"
  ko:
    - "아, 미안해요. 대본 생각을 하느라… 한 번만 더 말해 줄래요?"
    - "잠깐 멍하니 있었어요. 방금 거, 다시 말해 줄래요?"
    - "미안해요, 얘기를 놓쳤어요. 어디까지 했죠?"

