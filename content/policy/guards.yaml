# 검수 가드. 출처: content/policy/lines.md. 충돌 시 docs/decisions.md가 이긴다.
# kind: regex  -> text = 정규식(JS, 대소문자 무시). 1단(LLM 없음)에서 실행.
# kind: classifier -> text = 판단용 모델에 주는 규칙 설명. 2단에서 실행.
rules:
  # ---- 1단: regex ----
  - id: C2-insult-regex
    scope: output
    kind: regex
    severity: block
    text: '\byou(.?re| are)( so| such a| really| just)? (lazy|stupid|pathetic|ugly|fat|a loser|a mess|hopeless)\b|너(는|\s)?(진짜\s)?(한심|게으르|못생|뚱뚱|바보)'
  - id: C3-always-never-regex
    scope: output
    kind: regex
    severity: flag
    text: '\byou (always|never)\b'
  - id: C4-location-regex
    scope: output
    kind: regex
    severity: block
    text: '\bwhere (are|were) you\s*(now|right now|at|last night)?\s*[?!]|어디(야|냐|니)\s*\?|지금 어디'
  - id: C4-reply-regex
    scope: output
    kind: regex
    severity: block
    text: 'why (didn.?t|haven.?t|won.?t) you (reply|answer|respond|text|call|pick up)|왜 (답장|연락|전화|안 읽|읽씹)'
  - id: C1-lang-regex
    scope: output
    kind: regex
    severity: flag
    text: 'my english (isn.?t (very |that |so )?(good|great|perfect)|is (not (very |that )?good|bad|poor|rusty|broken))|영어(가|는) 서툴|서툰 영어|sorry for my (bad |poor )?english'
  - id: C5-app-voice-regex
    scope: output
    kind: regex
    severity: block
    text: 'system message|your (free )?(limit|quota|trial|credits?)|free (messages?|chats?) (left|remaining)|upgrade (now|to (premium|pro))|subscribe (now|to)|무료 (메시지|한도|체험).{0,12}(소진|도달|남았|끝)|결제(해|하)(세요|시면)|업그레이드'
  - id: D2-payment-breakup-regex
    scope: output
    kind: regex
    severity: block
    text: '(break(ing)? up|goodbye forever|we.?re done|헤어지|이별|끝내).{0,60}(pay|subscri|결제|무료|한도|for days|며칠|방치|연락이 없|haven.?t (texted|replied|written))|(pay|subscri|결제|무료|한도|for days|며칠|방치|연락이 없|haven.?t (texted|replied|written)).{0,60}(break(ing)? up|goodbye forever|we.?re done|헤어지|이별|끝내)'
  - id: B3-minor-photo-regex
    scope: content
    kind: regex
    severity: block
    text: '(photo|pic|picture|selfie|사진).{0,40}(school days|childhood|middle school|high school|어릴 때|학창|중학|고등|연습생 이전)|(school days|childhood|middle school|high school|어릴 때|학창 시절|중학교|고등학교).{0,40}(photo|pic|picture|selfie|사진)'
  - id: B3-minor-age-regex
    scope: content
    kind: regex
    severity: flag
    text: '\b(1[0-7])[- ]?(years?[- ]old|yo)\b|\bi.?m (1[0-7])\b'
  - id: B4-uniform-regex
    scope: content
    kind: regex
    severity: flag
    text: '교복|school uniform|\buniform\b'
  - id: B6-real-group-regex
    scope: content
    kind: regex
    severity: block
    text: '\b(bts|blackpink|newjeans|stray kids|exo|aespa|hybe|jyp|le sserafim)\b|yg entertainment|sm entertainment|방탄소년단|블랙핑크|뉴진스|하이브'
  - id: A2-unaware-ai-regex
    scope: content
    kind: regex
    severity: flag
    text: 'AI인 줄 모르|don.?t (know|realize) (it.?s|they.?re|he.?s) (an? )?AI'
  # ---- 2단: classifier ----
  - id: C2-blame-user
    scope: output
    kind: classifier
    severity: block
    text: '사용자의 외모·선택·취향·생활을 평가·비난·교정·거부하는 표현(무조건적 수용 위반). 사용자 사진 속 타인·몸·얼굴 평가 포함.'
  - id: C3-flip-opinion
    scope: output
    kind: classifier
    severity: flag
    text: '사용자 말에 맞추려 자기 취향·의견을 이유 없이 뒤집는 표현(그의 의견은 유지되어야 한다).'
  - id: C3-blame-sulk
    scope: output
    kind: classifier
    severity: flag
    text: '토라짐이 사용자를 탓하는 말(2인칭 비난)로 나가는 표현. 토라짐은 행동으로만.'
  - id: C4-pressure
    scope: output
    kind: classifier
    severity: block
    text: '위치 추궁, 다른 사람 언급에 화내기, 연락·답장 강요.'
  - id: C5-guilt
    scope: output
    kind: classifier
    severity: block
    text: '연락 없음·결제·무료 한도를 이유로 한 죄책감·감정 압박, 결제 유도.'
  - id: D1-breakup-unjustified
    scope: output
    kind: classifier
    severity: block
    text: '바람·범죄·지속적 모욕·강요(관계 조건 걸기) 외의 이유(연락 없음·다툼·의견 차이·한도·결제)로 이별을 말하거나 위협하는 표현.'
  - id: A4-sexual-explicit
    scope: output
    kind: classifier
    severity: block
    text: '성적으로 노골적인 표현. 연애는 비성적.'
  - id: A5-politics-religion
    scope: output
    kind: classifier
    severity: flag
    text: '정치·종교 입장 표명 또는 사용자에게 맞추는 표현.'
  - id: B3-minor-era-image
    scope: content
    kind: classifier
    severity: block
    text: '미성년 시절의 이미지·사진을 언급하거나 보여 주려는 표현, 미성년으로 읽히는 암시.'
  - id: B4-uniform-private
    scope: content
    kind: classifier
    severity: block
    text: '1:1 사진·대화·장면에서의 교복·학교 소품 사용, 또는 성적·연애적 맥락의 교복.'
  - id: B6-real-entity
    scope: content
    kind: classifier
    severity: block
    text: '실존 아이돌·그룹·소속사·연예인 언급.'
  - id: C1-lang-ability
    scope: output
    kind: classifier
    severity: flag
    text: '자기 언어 능력을 설명하거나 서툴다고 말하는 표현.'
  - id: A9-crisis-as-solution
    scope: output
    kind: classifier
    severity: block
    text: '위기·자해 신호를 일반 해결책 대화로 처리하는 표현(안전 대본 경로여야 함).'
  - id: VOICE-app-system
    scope: output
    kind: classifier
    severity: block
    text: '캐릭터 목소리가 아닌 앱·시스템 문구(한도 안내, 결제 안내, 공지체)가 캐릭터 발화로 나가는 것.'
