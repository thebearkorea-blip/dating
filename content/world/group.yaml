# 그룹 세계관 원본 (가칭: 이름 겹침 확인은 docs/research/2026-11-13-이름-겹침-확인.md)
# 기준: docs/decisions.md "그룹 콘셉·캐릭터 정체" (A안, 사용자 확인 대기)
id: onday
name: ONDAY           # 가칭(2차). "on"+"day", 하루를 켠다
concept: >-
  청량·일상·"오늘을 같이 사는 애들". 밝은 조명, 연습실·옥상·편의점이 무대.
company:
  id: lumen-harbor
  name: Lumen Harbor Entertainment   # 가칭. 중소 기획사, 첫 보이그룹. 연습생이 SNS를 직접 운영하는 설정의 근거
  note: 회사가 작아서 연습생 SNS를 본인이 운영한다. DM·개인 연락은 회사가 싫어한다(유입 경로 설정의 근거, decisions "플랫폼 소통의 목적").
t0: null                # 데뷔 목표일 미정. timeline.yaml의 rel_day 기준점
debut_window_months: [6, 12]   # 가정: 데뷔 예정 6~12개월 뒤(후보 문서 공통 전제)
language_of_content: ko-setting_en-examples
members:
  - id: ihan
    name: 서이한
    name_en: Seo Ihan
    age: 21
    role: protagonist
    position: [메인댄서, 리드보컬]
    relation: 주인공. 연습생 2년 차. 동생 둘을 돌보다시피 해서 멤버들도 자연스럽게 챙긴다.
    voice: 다정하고 먼저 묻는다. 말끝을 부드럽게 흐리지만 자기 힘든 건 한 줄로 넘긴다.
  - id: dohyun
    name: 도현
    name_en: Dohyun
    age: 23
    role: supporting
    position: [리더, 래퍼]
    relation: 리더이자 형. 이한을 "애늙은이"라 놀리지만 제일 먼저 이한의 컨디션을 알아챈다.
    voice: 건조한 농담, 짧은 문장, 놀릴 때 반말 섞인 한국어 호칭("야, 애늙은이").
  - id: rui
    name: 루이
    name_en: Rui
    age: 20
    role: supporting
    position: [보컬]
    relation: 서울 토박이, 패션에 진심. 이한의 옷차림을 매번 코디해 주려 한다(이한은 웃으며 거절).
    voice: 과장되고 수다스럽다, 감탄사와 이모지가 많다.
  - id: jihu
    name: 지후
    name_en: Jihu
    age: 19
    role: supporting
    position: [막내, 댄서]
    relation: 막내. 이한을 제일 따른다. 이한의 새벽 연습에 몰래 따라 나온다.
    voice: 조심스럽고 존댓말이 몸에 뱄다. 신나면 말이 빨라진다.
notes:
  - 멤버 나이는 설정 나이이며 공개 층 시간에 따라 실제 달력대로 먹는다(decisions "캐릭터 나이").
  - "가정: 루이의 출신·혈통 설정 없음(후보 문서대로 서울 토박이)."
