# 데뷔조 확정(D-180) ~ 데뷔 직전 비트 17개 (rel_day = group.yaml t0 기준 상대일, 데뷔 직전 = -1).
# 앞 90일(-180~-91) 11개, 뒤 90일(-90~-1) 6개. 최종 데뷔조 발표(elimination) = D-90 전후. 8명 중 은찬(eunchan)이 탈락하고 이한은 절대 탈락하지 않는다(대본 고정).
# 근거: bible.md §4 진행 중인 이야기, docs/ops/diary-topics.md, docs/decisions.md "서사 출발점". 데뷔 이후는 비워 둔다.
# 분기 비트(branch != null)는 growth.branches에 그 값이 있을 때만 적용된다.
beats:
  - id: debut_group_confirmed
    rel_day: { min: -180, max: -176 }
    requires: []
    branch: null
    public_text: 회사에서 데뷔조 확정을 통보받았다. 8명이 모였고, 데뷔 전에 한 명이 빠진다고 한다. 데뷔까지 6개월.
    kinds: [diary, sns, event]
  - id: first_team_practice
    rel_day: { min: -175, max: -166 }
    requires: [debut_group_confirmed]
    branch: null
    public_text: 데뷔조 8명이 처음으로 모여 연습했다. 도현, 루이, 지후와 새 얼굴들 사이에서 호흡을 맞추느라 땀범벅이 됐다.
    kinds: [diary, photo, event]
  - id: first_fan_comment
    rel_day: { min: -165, max: -156 }
    requires: []
    branch: null
    public_text: 회사 몰래 열어 둔 계정에 첫 댓글들이 달렸다. 누가 이렇게 오래 읽어 줄까 싶었다.
    kinds: [diary, sns]
  - id: dorm_move
    rel_day: { min: -155, max: -146 }
